<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d12"><title>しろつち — 息づく絵本</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#canvas-viewport{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#canvas-surface{position:relative;width:100%;height:100%}
#canvas-holder{position:absolute;inset:0 auto auto 0;width:100%;height:100%}
#game-frame{position:relative;display:block;border:0;width:100%;height:100%;transform-origin:top left}
#canvas-tools[hidden]{display:none!important}
#canvas-tools{position:fixed;z-index:5;display:flex;gap:3px;align-items:center;padding:3px;background:#07121bd9;border-radius:6px;color:#edf1ee;box-sizing:border-box;font:12px/1.2 sans-serif}
#canvas-tools button{box-sizing:border-box;min-width:30px;min-height:28px;border:1px solid #91a5ad88;border-radius:4px;background:#18303b;color:inherit;padding:3px 7px;font:12px/1.2 sans-serif;cursor:pointer}
#canvas-tools button:focus-visible{outline:2px solid #f9dd9a;outline-offset:2px}
#canvas-ratio{position:absolute;overflow:hidden;width:1px;height:1px;clip-path:inset(50%)}
</style></head><body>
<main id="canvas-viewport" aria-label="しろつち — 息づく絵本"><div id="canvas-surface"><div id="canvas-holder"><iframe id="game-frame" title="しろつち — 息づく絵本" allow="autoplay; fullscreen" src="about:blank"></iframe></div></div></main>
<nav id="canvas-tools" aria-label="画面全体の拡大縮小" hidden><button id="canvas-minus" aria-label="画面全体を縮小">−</button><button id="canvas-plus" aria-label="画面全体を拡大">＋</button><button id="canvas-reset">全体</button><span id="canvas-ratio" role="status" aria-live="polite"></span></nav>
<script src="whole-canvas.js?v=1"></script></body></html>
